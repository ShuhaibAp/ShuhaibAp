<svg xmlns="http://www.w3.org/2000/svg" width="860" height="262" viewBox="0 0 860 262" role="img" aria-label="Terminal showing the tech stack: Next.js, React, Tailwind, NestJS, Node.js, MongoDB.">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0969da"/><stop offset="1" stop-color="#8250df"/></linearGradient>
    <clipPath id="win"><rect x="0.5" y="0.5" width="859" height="261" rx="12"/></clipPath>
  </defs>
  <style>
    text{font-family:ui-monospace, 'JetBrains Mono', 'Fira Code', Consolas, Menlo, 'DejaVu Sans Mono', monospace;fill:#1f2328}
    .g{fill:#1a7f37} .t{fill:#1f2328} .m{fill:#656d76} .p{fill:#8250df} .b{fill:#0969da} .o{fill:#bc4c00}
    .cv{fill:#ffffff;transform-box:fill-box;transform-origin:100% 50%;transform:scaleX(0);animation-name:reveal;animation-fill-mode:backwards}
    @keyframes reveal{from{transform:scaleX(1)}to{transform:scaleX(0)}}
    .cur{fill:#1a7f37;animation:blink 1.1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .dot{animation:pulse 2.4s ease-in-out infinite}
    @keyframes pulse{50%{opacity:.35}}
    @media (prefers-reduced-motion:reduce){.cv,.cur,.dot{animation:none}}
  </style>
  <g clip-path="url(#win)">
    <rect width="860" height="262" fill="#ffffff"/>
    <rect width="860" height="40" fill="#f6f8fa"/>
    <rect y="40" width="860" height="1" fill="#d0d7de"/>
    <rect width="860" height="3" fill="url(#grad)"/>
    <circle cx="24" cy="21" r="6" fill="#ff5f56"/><circle cx="44" cy="21" r="6" fill="#ffbd2e"/><circle cx="64" cy="21" r="6" fill="#27c93f"/>
    <text x="430" y="26" font-size="12" text-anchor="middle" class="m" style="fill:#656d76">shuhaib@dev: ~/stack</text>
    <circle class="dot" cx="768" cy="21" r="4" fill="#1a7f37"/>
    <text x="780" y="25" font-size="11" class="m" style="fill:#656d76">online</text>
    <text x="28" y="80" font-size="15" xml:space="preserve"><tspan class="g">$ </tspan><tspan class="t">cat stack.json</tspan></text>
    <text x="28" y="107" font-size="15" xml:space="preserve"><tspan class="t">{</tspan></text>
    <text x="28" y="134" font-size="15" xml:space="preserve"><tspan class="t">  </tspan><tspan class="b">"frontend"</tspan><tspan class="t">: [</tspan><tspan class="o">"Next.js"</tspan><tspan class="t">, </tspan><tspan class="o">"React"</tspan><tspan class="t">, </tspan><tspan class="o">"Tailwind"</tspan><tspan class="t">],</tspan></text>
    <text x="28" y="161" font-size="15" xml:space="preserve"><tspan class="t">  </tspan><tspan class="b">"backend"</tspan><tspan class="t">:  [</tspan><tspan class="o">"NestJS"</tspan><tspan class="t">, </tspan><tspan class="o">"Node.js"</tspan><tspan class="t">, </tspan><tspan class="o">"MongoDB"</tspan><tspan class="t">],</tspan></text>
    <text x="28" y="188" font-size="15" xml:space="preserve"><tspan class="t">  </tspan><tspan class="b">"status"</tspan><tspan class="t">:   </tspan><tspan class="o">"shipping"</tspan><tspan class="cur">▋</tspan></text>
    <text x="28" y="215" font-size="15" xml:space="preserve"><tspan class="t">}</tspan></text>
    <rect class="cv" x="22" y="61" width="816" height="29" style="animation-duration:0.56s;animation-delay:0.50s;animation-timing-function:steps(16,end)"/>
    <rect class="cv" x="22" y="88" width="816" height="29" style="animation-duration:0.35s;animation-delay:1.21s;animation-timing-function:steps(8,end)"/>
    <rect class="cv" x="22" y="115" width="816" height="29" style="animation-duration:1.65s;animation-delay:1.71s;animation-timing-function:steps(40,end)"/>
    <rect class="cv" x="22" y="142" width="816" height="29" style="animation-duration:1.65s;animation-delay:3.50s;animation-timing-function:steps(40,end)"/>
    <rect class="cv" x="22" y="169" width="816" height="29" style="animation-duration:0.88s;animation-delay:5.30s;animation-timing-function:steps(25,end)"/>
    <rect class="cv" x="22" y="196" width="816" height="29" style="animation-duration:0.35s;animation-delay:6.33s;animation-timing-function:steps(8,end)"/>
  </g>
  <rect x="0.5" y="0.5" width="859" height="261" rx="12" fill="none" stroke="#d0d7de"/>
</svg>
