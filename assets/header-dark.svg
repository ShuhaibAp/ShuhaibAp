<svg xmlns="http://www.w3.org/2000/svg" width="860" height="372" viewBox="0 0 860 372" role="img" aria-label="Terminal: Shuhaib Ap, full-stack developer. Stack: Next.js, React, Tailwind, NestJS, Node.js, MongoDB.">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#58a6ff"/><stop offset="1" stop-color="#bc8cff"/></linearGradient>
    <clipPath id="win"><rect x="0.5" y="0.5" width="859" height="371" rx="12"/></clipPath>
  </defs>
  <style>
    text{font-family:ui-monospace, 'JetBrains Mono', 'Fira Code', Consolas, Menlo, 'DejaVu Sans Mono', monospace;fill:#c9d1d9}
    .g{fill:#3fb950} .t{fill:#c9d1d9} .m{fill:#8b949e} .p{fill:#bc8cff} .b{fill:#58a6ff} .o{fill:#ffa657}
    .cv{fill:#0d1117;transform-box:fill-box;transform-origin:100% 50%;transform:scaleX(0);animation-name:reveal;animation-fill-mode:backwards}
    @keyframes reveal{from{transform:scaleX(1)}to{transform:scaleX(0)}}
    .cur{fill:#3fb950;animation:blink 1.1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .dot{animation:pulse 2.4s ease-in-out infinite}
    @keyframes pulse{50%{opacity:.35}}
    @media (prefers-reduced-motion:reduce){.cv,.cur,.dot{animation:none}}
  </style>
  <g clip-path="url(#win)">
    <rect width="860" height="372" fill="#0d1117"/>
    <rect width="860" height="40" fill="#161b22"/>
    <rect y="40" width="860" height="1" fill="#30363d"/>
    <rect width="860" height="3" fill="url(#grad)"/>
    <circle cx="24" cy="21" r="6" fill="#ff5f56"/><circle cx="44" cy="21" r="6" fill="#ffbd2e"/><circle cx="64" cy="21" r="6" fill="#27c93f"/>
    <text x="430" y="26" font-size="12" text-anchor="middle" class="m" style="fill:#8b949e">shuhaib@dev: ~/profile</text>
    <circle class="dot" cx="768" cy="21" r="4" fill="#3fb950"/>
    <text x="780" y="25" font-size="11" class="m" style="fill:#8b949e">online</text>
    <text x="28" y="80" font-size="15" xml:space="preserve"><tspan class="g">$ </tspan><tspan class="t">whoami</tspan></text>
    <text x="28" y="121" font-size="38" font-weight="700" xml:space="preserve"><tspan class="name" fill="url(#grad)">Shuhaib Ap</tspan></text>
    <text x="28" y="162" font-size="15" xml:space="preserve"><tspan class="m">Full-stack developer </tspan><tspan class="p">/ </tspan><tspan class="t">I build products end to end</tspan></text>
    <text x="28" y="203" font-size="15" xml:space="preserve"><tspan class="g">$ </tspan><tspan class="t">cat stack.json</tspan></text>
    <text x="28" y="230" font-size="15" xml:space="preserve"><tspan class="t">{</tspan></text>
    <text x="28" y="257" font-size="15" xml:space="preserve"><tspan class="t">  </tspan><tspan class="b">"frontend"</tspan><tspan class="t">: [</tspan><tspan class="o">"Next.js"</tspan><tspan class="t">, </tspan><tspan class="o">"React"</tspan><tspan class="t">, </tspan><tspan class="o">"Tailwind"</tspan><tspan class="t">],</tspan></text>
    <text x="28" y="284" font-size="15" xml:space="preserve"><tspan class="t">  </tspan><tspan class="b">"backend"</tspan><tspan class="t">:  [</tspan><tspan class="o">"NestJS"</tspan><tspan class="t">, </tspan><tspan class="o">"Node.js"</tspan><tspan class="t">, </tspan><tspan class="o">"MongoDB"</tspan><tspan class="t">],</tspan></text>
    <text x="28" y="311" font-size="15" xml:space="preserve"><tspan class="t">  </tspan><tspan class="b">"status"</tspan><tspan class="t">:   </tspan><tspan class="o">"shipping"</tspan><tspan class="cur">▋</tspan></text>
    <text x="28" y="338" font-size="15" xml:space="preserve"><tspan class="t">}</tspan></text>
    <rect class="cv" x="22" y="61" width="816" height="29" style="animation-duration:0.35s;animation-delay:0.50s;animation-timing-function:steps(8,end)"/>
    <rect class="cv" x="22" y="79" width="816" height="52" style="animation-duration:0.50s;animation-delay:1.00s;animation-timing-function:steps(10,end)"/>
    <rect class="cv" x="22" y="143" width="816" height="29" style="animation-duration:1.75s;animation-delay:1.65s;animation-timing-function:steps(40,end)"/>
    <rect class="cv" x="22" y="184" width="816" height="29" style="animation-duration:0.56s;animation-delay:3.80s;animation-timing-function:steps(16,end)"/>
    <rect class="cv" x="22" y="211" width="816" height="29" style="animation-duration:0.35s;animation-delay:4.51s;animation-timing-function:steps(8,end)"/>
    <rect class="cv" x="22" y="238" width="816" height="29" style="animation-duration:1.65s;animation-delay:5.01s;animation-timing-function:steps(40,end)"/>
    <rect class="cv" x="22" y="265" width="816" height="29" style="animation-duration:1.65s;animation-delay:6.80s;animation-timing-function:steps(40,end)"/>
    <rect class="cv" x="22" y="292" width="816" height="29" style="animation-duration:0.88s;animation-delay:8.60s;animation-timing-function:steps(25,end)"/>
    <rect class="cv" x="22" y="319" width="816" height="29" style="animation-duration:0.35s;animation-delay:9.63s;animation-timing-function:steps(8,end)"/>
  </g>
  <rect x="0.5" y="0.5" width="859" height="371" rx="12" fill="none" stroke="#30363d"/>
</svg>
