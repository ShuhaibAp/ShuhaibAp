<svg xmlns="http://www.w3.org/2000/svg" width="860" height="252" viewBox="0 0 860 252" role="img" aria-label="Featured project: Cynosure MIS, a B2B e-waste ERP and workflow system built with Next.js, NestJS, TypeScript and MongoDB. Workflow: register, inspect, quote, pickup, process, report.">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0969da"/><stop offset="1" stop-color="#8250df"/></linearGradient>
    <clipPath id="card"><rect x="0.5" y="0.5" width="859" height="251" rx="14"/></clipPath>
    <linearGradient id="gl" gradientUnits="userSpaceOnUse" x1="70" y1="0" x2="790" y2="0"><stop offset="0" stop-color="#0969da"/><stop offset="1" stop-color="#8250df"/></linearGradient>
    <linearGradient id="gv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0969da"/><stop offset="1" stop-color="#8250df"/></linearGradient>
  </defs>
  <style>
    .mono{font-family:ui-monospace, 'JetBrains Mono', 'Fira Code', Consolas, Menlo, 'DejaVu Sans Mono', monospace} .sans{font-family:system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif}
    .prog{stroke-dasharray:720;animation:fill 8s linear infinite}
    @keyframes fill{0%{stroke-dashoffset:720}64%,92%{stroke-dashoffset:0}100%{stroke-dashoffset:720}}
    @keyframes n0{0%,0.0%{fill:#eaeef2;stroke:#d0d7de}3.0%,92%{fill:url(#g);stroke:#0969da}100%{fill:#eaeef2;stroke:#d0d7de}}
    @keyframes n1{0%,12.8%{fill:#eaeef2;stroke:#d0d7de}15.8%,92%{fill:url(#g);stroke:#0969da}100%{fill:#eaeef2;stroke:#d0d7de}}
    @keyframes n2{0%,25.6%{fill:#eaeef2;stroke:#d0d7de}28.6%,92%{fill:url(#g);stroke:#0969da}100%{fill:#eaeef2;stroke:#d0d7de}}
    @keyframes n3{0%,38.4%{fill:#eaeef2;stroke:#d0d7de}41.4%,92%{fill:url(#g);stroke:#0969da}100%{fill:#eaeef2;stroke:#d0d7de}}
    @keyframes n4{0%,51.2%{fill:#eaeef2;stroke:#d0d7de}54.2%,92%{fill:url(#g);stroke:#0969da}100%{fill:#eaeef2;stroke:#d0d7de}}
    @keyframes n5{0%,64.0%{fill:#eaeef2;stroke:#d0d7de}67.0%,92%{fill:url(#g);stroke:#0969da}100%{fill:#eaeef2;stroke:#d0d7de}}
    .pop{animation:pop .7s cubic-bezier(.2,.8,.2,1) backwards}
    @keyframes pop{from{opacity:0;transform:translateY(10px)}}
    @media (prefers-reduced-motion:reduce){.prog,.node,.pop{animation:none!important}}
  </style>
  <rect x="0.5" y="0.5" width="859" height="251" rx="14" fill="#ffffff" stroke="#d0d7de"/>
  <rect x="0" y="0" width="6" height="252" fill="url(#gv)" clip-path="url(#card)"/>
  <circle cx="640" cy="34" r="2" fill="#1f2328" fill-opacity="0.10"/><circle cx="664" cy="34" r="2" fill="#1f2328" fill-opacity="0.10"/><circle cx="688" cy="34" r="2" fill="#1f2328" fill-opacity="0.10"/><circle cx="712" cy="34" r="2" fill="#1f2328" fill-opacity="0.10"/><circle cx="736" cy="34" r="2" fill="#1f2328" fill-opacity="0.10"/><circle cx="760" cy="34" r="2" fill="#1f2328" fill-opacity="0.10"/><circle cx="784" cy="34" r="2" fill="#1f2328" fill-opacity="0.10"/><circle cx="808" cy="34" r="2" fill="#1f2328" fill-opacity="0.10"/><circle cx="832" cy="34" r="2" fill="#1f2328" fill-opacity="0.10"/><circle cx="640" cy="58" r="2" fill="#1f2328" fill-opacity="0.10"/><circle cx="664" cy="58" r="2" fill="#1f2328" fill-opacity="0.10"/><circle cx="688" cy="58" r="2" fill="#1f2328" fill-opacity="0.10"/><circle cx="712" cy="58" r="2" fill="#1f2328" fill-opacity="0.10"/><circle cx="736" cy="58" r="2" fill="#1f2328" fill-opacity="0.10"/><circle cx="760" cy="58" r="2" fill="#1f2328" fill-opacity="0.10"/><circle cx="784" cy="58" r="2" fill="#1f2328" fill-opacity="0.10"/><circle cx="808" cy="58" r="2" fill="#1f2328" fill-opacity="0.10"/><circle cx="832" cy="58" r="2" fill="#1f2328" fill-opacity="0.10"/><circle cx="640" cy="82" r="2" fill="#1f2328" fill-opacity="0.10"/><circle cx="664" cy="82" r="2" fill="#1f2328" fill-opacity="0.10"/><circle cx="688" cy="82" r="2" fill="#1f2328" fill-opacity="0.10"/><circle cx="712" cy="82" r="2" fill="#1f2328" fill-opacity="0.10"/><circle cx="736" cy="82" r="2" fill="#1f2328" fill-opacity="0.10"/><circle cx="760" cy="82" r="2" fill="#1f2328" fill-opacity="0.10"/><circle cx="784" cy="82" r="2" fill="#1f2328" fill-opacity="0.10"/><circle cx="808" cy="82" r="2" fill="#1f2328" fill-opacity="0.10"/><circle cx="832" cy="82" r="2" fill="#1f2328" fill-opacity="0.10"/><circle cx="640" cy="106" r="2" fill="#1f2328" fill-opacity="0.10"/><circle cx="664" cy="106" r="2" fill="#1f2328" fill-opacity="0.10"/><circle cx="688" cy="106" r="2" fill="#1f2328" fill-opacity="0.10"/><circle cx="712" cy="106" r="2" fill="#1f2328" fill-opacity="0.10"/><circle cx="736" cy="106" r="2" fill="#1f2328" fill-opacity="0.10"/><circle cx="760" cy="106" r="2" fill="#1f2328" fill-opacity="0.10"/><circle cx="784" cy="106" r="2" fill="#1f2328" fill-opacity="0.10"/><circle cx="808" cy="106" r="2" fill="#1f2328" fill-opacity="0.10"/><circle cx="832" cy="106" r="2" fill="#1f2328" fill-opacity="0.10"/>
  <g class="pop" style="animation-delay:.05s">
    <text x="36" y="46" class="mono" font-size="12" letter-spacing="2.5" fill="url(#g)" font-weight="700">FEATURED PROJECT</text>
    <text x="36" y="88" class="sans" font-size="32" font-weight="800" letter-spacing="-0.5" style="fill:#1f2328">Cynosure MIS</text>
    <text x="36" y="113" class="sans" font-size="15" style="fill:#656d76">B2B e-waste ERP: customer portal and workflow API</text>
  </g>
  <g class="pop" style="animation-delay:.25s">
    <rect x="36" y="128" width="78" height="26" rx="13" fill="#f6f8fa" stroke="#d0d7de"/><text x="75" y="145.5" text-anchor="middle" class="mono" font-size="12" style="fill:#1f2328">Next.js</text>
    <rect x="124" y="128" width="70" height="26" rx="13" fill="#f6f8fa" stroke="#d0d7de"/><text x="159" y="145.5" text-anchor="middle" class="mono" font-size="12" style="fill:#1f2328">NestJS</text>
    <rect x="204" y="128" width="100" height="26" rx="13" fill="#f6f8fa" stroke="#d0d7de"/><text x="254" y="145.5" text-anchor="middle" class="mono" font-size="12" style="fill:#1f2328">TypeScript</text>
    <rect x="314" y="128" width="78" height="26" rx="13" fill="#f6f8fa" stroke="#d0d7de"/><text x="353" y="145.5" text-anchor="middle" class="mono" font-size="12" style="fill:#1f2328">MongoDB</text>
    <rect x="402" y="128" width="85" height="26" rx="13" fill="#f6f8fa" stroke="#d0d7de"/><text x="444.5" y="145.5" text-anchor="middle" class="mono" font-size="12" style="fill:#1f2328">JWT auth</text>
  </g>
  <g class="pop" style="animation-delay:.45s">
    <line x1="70" y1="196" x2="790" y2="196" stroke="#d0d7de" stroke-width="3" stroke-linecap="round"/>
    <line class="prog" x1="70" y1="196" x2="790" y2="196" stroke="url(#gl)" stroke-width="3" stroke-linecap="round"/>
    <circle class="node" style="animation:n0 8s infinite" cx="70" cy="196" r="8" fill="url(#g)" stroke="#0969da" stroke-width="2"/>
    <text x="70" y="226" text-anchor="middle" class="sans" font-size="12.5" style="fill:#656d76">Register</text>
    <circle class="node" style="animation:n1 8s infinite" cx="214" cy="196" r="8" fill="url(#g)" stroke="#0969da" stroke-width="2"/>
    <text x="214" y="226" text-anchor="middle" class="sans" font-size="12.5" style="fill:#656d76">Inspect</text>
    <circle class="node" style="animation:n2 8s infinite" cx="358" cy="196" r="8" fill="url(#g)" stroke="#0969da" stroke-width="2"/>
    <text x="358" y="226" text-anchor="middle" class="sans" font-size="12.5" style="fill:#656d76">Quote</text>
    <circle class="node" style="animation:n3 8s infinite" cx="502" cy="196" r="8" fill="url(#g)" stroke="#0969da" stroke-width="2"/>
    <text x="502" y="226" text-anchor="middle" class="sans" font-size="12.5" style="fill:#656d76">Pickup</text>
    <circle class="node" style="animation:n4 8s infinite" cx="646" cy="196" r="8" fill="url(#g)" stroke="#0969da" stroke-width="2"/>
    <text x="646" y="226" text-anchor="middle" class="sans" font-size="12.5" style="fill:#656d76">Process</text>
    <circle class="node" style="animation:n5 8s infinite" cx="790" cy="196" r="8" fill="url(#g)" stroke="#0969da" stroke-width="2"/>
